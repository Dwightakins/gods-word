<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>God's Word</title>
<meta name="description" content="A simple, ad-free King James Bible with a daily verse, daily reading, and verses and prayers for what you are going through.">
<meta name="theme-color" content="#5a1322">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="God's Word">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: quiet, reverent, warm. A Bible you hold, not a feed you scroll.
IDEA: a leather-bound KJV: oxblood cover, gilt edge, well-set pages.
PICTURE: the verse of the day set large on the oxblood cover band.
COLOUR and TYPE: white page, oxblood #5a1322, gilt #c9973f accent; EB Garamond for scripture, Inter for the app.
LAYOUT: one reading column, top bar, bottom tabs on phone, sheets for pickers.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#141012);--card:light-dark(#f6f2f0,#1f191b);--line:light-dark(#e7dfdc,#33292c);
--ink:light-dark(#1d1416,#efe7e4);--mute:light-dark(#6e6064,#a8999d);
--ox:#5a1322;--ox2:light-dark(#7a1d31,#c46a7d);--gilt:light-dark(#a8781f,#d9ad5a);
--hl1:light-dark(#fbeaa0,#5b4a12);--hl2:light-dark(#cfe8d4,#1f4a2c);--hl3:light-dark(#f6d1da,#5a2533);
--fs:20px;--serif:"EB Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;border-radius:10px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
a{color:var(--ox2)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:23px;font-weight:600;text-decoration:none;color:var(--ink)}
.brand img{width:30px;height:30px;border-radius:7px}
.brand small{font:500 12px var(--sans);color:var(--mute);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.icon{width:44px;display:grid;place-items:center;margin-left:auto}
.icon svg{width:22px;height:22px}
main{max-width:760px;margin:auto;padding:0 max(16px,env(safe-area-inset-left)) 24px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;text-decoration:none;color:var(--mute);font-size:12px;font-weight:500;min-height:56px}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:var(--ox2)}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,40px)}h2{font-size:24px}
.label{font-size:13px;color:var(--mute);font-weight:500}
.cover{margin:16px calc(-1*max(16px,env(safe-area-inset-left))) 0;padding:28px max(20px,5vw) 24px;background:var(--ox);color:#fbf3e2;position:relative;overflow:hidden}
@media(min-width:792px){.cover{margin-inline:0;border-radius:18px}}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,#8d6a2a,#e2b65a,#8d6a2a)}
.cover .label{color:#e2c79a}
.cover blockquote{margin:14px 0 10px;font:400 clamp(24px,5.4vw,32px)/1.3 var(--serif)}
.cover cite{font:600 15px var(--sans);font-style:normal;color:#e2b65a}
.cover p{margin:14px 0 0;color:#f0dfd0;font-size:15px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{padding:0 16px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.cover .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.btn.primary{background:var(--ox);border-color:var(--ox);color:#fff}
section{margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;margin-top:12px}
.card{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);width:100%}
.card b{display:block;font-weight:600;font-size:16px}
.card span{font-size:14px;color:var(--mute)}
.card.crisis{border-color:var(--ox2);background:light-dark(#fbeef1,#2a1419)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:0 14px;border:1px solid var(--line);border-radius:22px;font-size:15px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;min-height:44px}
.readbar{position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:10;background:var(--bg);display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.picker{font:600 20px var(--serif);padding:0 10px;display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;flex:1;justify-content:flex-start;text-align:left;line-height:1.1}.picker .label{width:100%}
.nav2{width:44px;height:44px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.nav2 svg{width:20px;height:20px}
.text{font:400 var(--fs)/1.7 var(--serif);margin-top:18px;max-width:66ch}
.text h1{margin:6px 0 14px}
.v{border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .3s}
.v sup{font:600 .55em var(--sans);color:var(--gilt);margin-right:3px;vertical-align:.5em}
.v.sel{text-decoration:underline dotted var(--ox2);text-underline-offset:5px}
.v.h1{background:var(--hl1)}.v.h2{background:var(--hl2)}.v.h3{background:var(--hl3)}
.v.flash{background:var(--hl1)}
.v .bm{display:inline-block;width:.55em;height:.75em;background:var(--ox2);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);margin-left:4px}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:0 18px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);border-radius:0;text-align:left;font-size:17px}
.brow small{color:var(--mute);font-size:13px;white-space:nowrap}
.brow.on span{color:var(--ox2);font-weight:600}
.sect{margin:18px 0 2px}
.card.jump{margin-top:12px;background:var(--ox);color:#fff;border-color:var(--ox)}.card.jump span{color:#f0dfd0}
.finds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.findbox{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;color:var(--ink)!important;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mute);text-decoration:none;font-size:16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px;display:none;gap:4px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);width:min(360px,calc(100% - 24px));flex-wrap:wrap;justify-content:center}
.actions.show{display:flex}
.actions button{padding:0 10px;font-size:14px;font-weight:500}
.dot{width:30px;height:30px;min-height:30px;border-radius:50%;border:2px solid rgba(128,128,128,.4)!important;margin:7px 3px}
.sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.45)}
.sheet.show{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:6px;margin:10px 0 18px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.grid button{background:var(--card);border:1px solid var(--line);font-size:15px;padding:0 8px;text-align:left}
.grid.ch button{text-align:center}
.grid button.on{background:var(--ox);color:#fff;border-color:var(--ox)}
.verse{border-top:1px solid var(--line);padding:16px 0}
.verse p{font:400 calc(var(--fs) - 1px)/1.6 var(--serif);margin:4px 0 8px}
.verse .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.verse .meta b{color:var(--ox2);font-size:15px;margin-right:auto}
.small{min-height:36px;font-size:14px;padding:0 10px;border:1px solid var(--line)}
.prayer{background:var(--card);border-left:4px solid var(--gilt);border-radius:8px;padding:16px 18px;margin-top:10px;font:italic 400 calc(var(--fs) - 1px)/1.6 var(--serif)}
.help{background:light-dark(#fbeef1,#2a1419);border:1px solid var(--ox2);border-radius:14px;padding:16px 18px;margin-top:16px}
.help ul{padding-left:18px;margin:8px 0}
.help li{margin:6px 0}
.help a{font-weight:600;white-space:nowrap}
input[type=search]{width:100%;font:16px var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:48px}
mark{background:var(--hl1);color:inherit;border-radius:3px}
.empty{color:var(--mute);padding:28px 0;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg button{padding:0 14px;min-height:38px;font-size:14px}
.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%}.seg a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:500}.seg a.on{background:var(--ox);color:#fff}
.seg button.on{background:var(--ox);color:#fff}
.setting{padding:14px 0;border-top:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--ox)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-size:15px;margin-top:14px;min-height:44px}
@media(min-width:900px){body{padding-bottom:0}.tabs{position:sticky;top:calc(57px + env(safe-area-inset-top));bottom:auto;max-width:760px;margin:auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(4,auto);justify-content:start;gap:4px}.tabs a{flex-direction:row;font-size:15px;min-height:46px;padding:0 14px;gap:8px}.tabs a svg{width:19px}.readbar{top:calc(105px + env(safe-area-inset-top))}.actions{bottom:24px}.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#today"><img src="icons/icon-192.png" alt="">God's Word <small>KJV</small></a>
  <button class="icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<nav class="tabs" aria-label="Main">
  <a href="#today" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</a>
  <a href="#bible" data-t="bible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24"/><path d="M12 7v6M9 10h6"/></svg>Bible</a>
  <a href="#help" data-t="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>Help me</a>
  <a href="#saved" data-t="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
</nav>
<main id="view"></main>
<div class="actions" id="actions" role="toolbar" aria-label="Verse actions">
  <button class="dot" data-hl="1" aria-label="Yellow highlight" style="background:#f3d95c"></button>
  <button class="dot" data-hl="2" aria-label="Green highlight" style="background:#8fcf9d"></button>
  <button class="dot" data-hl="3" aria-label="Pink highlight" style="background:#ee9db0"></button>
  <button data-a="clear">Clear</button>
  <button data-a="bm">Bookmark</button>
  <button data-a="copy">Copy</button>
  <button data-a="share">Share</button>
  <button data-a="close" aria-label="Close">✕</button>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
